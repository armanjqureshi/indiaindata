[build]
  command = "npm run build"
  publish = "dist/client"
  # Netlify's free plan charges credits for every production deploy. Skip the
  # build when a commit only touches automated data (live/), CI config or data
  # scripts: the site reads live/ at runtime, so it stays current without one.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)live' ':(exclude).github' ':(exclude)scripts/data' ':(exclude)scripts/probe' ':(exclude)README.md'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
