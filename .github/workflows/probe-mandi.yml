name: Probe mandi prices API
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, india]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/mandi-probe.mjs
        env:
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
      - run: |
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/debug/mandi-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Mandi probe [skip netlify]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
