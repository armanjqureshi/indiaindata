name: Probe mandi prices API
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/mandi-probe.mjs
        env:
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
      - name: Publish the probe result
        run: node scripts/data/push-via-api.mjs "Mandi probe [skip netlify]" live/debug/mandi-probe.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
