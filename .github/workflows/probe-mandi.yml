name: Probe mandi prices API
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/mandi-probe.mjs
        env:
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git config core.autocrlf false
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $keep = Join-Path $env:RUNNER_TEMP 'mandi-probe.json'
          Copy-Item live/debug/mandi-probe.json $keep -Force
          foreach ($i in 1..3) {
            git fetch origin main
            git reset --hard origin/main
            New-Item -ItemType Directory -Force live/debug | Out-Null
            Copy-Item $keep live/debug/mandi-probe.json -Force
            git add live/debug/mandi-probe.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "No change"; break }
            git commit -m "Mandi probe [skip netlify]"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { Write-Host "Pushed"; break }
            Start-Sleep -Seconds 5
          }
          exit 0
