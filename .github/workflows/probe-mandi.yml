name: Probe mandi prices API
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/mandi-probe.mjs
        env:
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git config core.autocrlf false
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/debug/mandi-probe.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No change"; exit 0 }
          git commit -m "Mandi probe [skip netlify]"
          foreach ($i in 1..3) {
            git pull --rebase -q origin main
            git push -q origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          exit 0
