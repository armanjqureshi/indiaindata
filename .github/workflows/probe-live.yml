name: Probe live sources
# One-off, read-only test of intraday data sources. Writes nothing, commits nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-live
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/live-sources.mjs
