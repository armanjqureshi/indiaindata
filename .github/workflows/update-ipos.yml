name: Update IPO data
# Writes live/ipos.json and live/ipo/*.json. Commits are marked [skip netlify]
# and live/ is excluded from Netlify builds; the site loads these at runtime.
on:
  schedule:
    - cron: '0 2,5,8,11,14,17,20,23 * * *'    # every 3 hours (07:30, 10:30, 13:30, 16:30, 19:30, 22:30, 01:30, 04:30 IST); 19:30 follows NSE's 19:00 final subscription update
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Fetch listing-day prices for listings in the last N days (0 = normal run)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch IPO data from NSE
        run: node scripts/data/update-ipos.mjs
        env:
          IPO_BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
      - name: Commit if anything changed
        run: |
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/ipos.json live/ipos-archive.json live/ipo
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git add live/ipos-log.json
          git commit -qm "IPO data $(TZ=Asia/Kolkata date +%F' '%H:%M) IST [skip netlify]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Refresh CDN copy
        run: |
          for f in ipos.json ipos-archive.json; do curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/live/$f" > /dev/null || true; done
          git diff --name-only HEAD~1 HEAD -- live/ipo 2>/dev/null | head -50 | while read f; do curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true; done
