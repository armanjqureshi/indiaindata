name: Update market data
# Runs after Indian market hours. Writes live/market.json only. Commits are
# marked [skip netlify] and live/ is excluded from Netlify builds, so this
# never uses Netlify build credits: the site loads live/ at runtime.
on:
  schedule:
    - cron: '35 13 * * 1-5'   # 19:05 IST, after NSE end-of-day files and FII/DII data
    - cron: '20 16 * * 1-5'   # 21:50 IST, catches late NSDL/IBJA updates
    - cron: '30 4 * * 6'      # Saturday 10:00 IST, EIA and NSDL catch-up
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Trading days of index history to backfill (0 = none)'
        default: '0'
      debug:
        description: 'Publish raw source pages to the probe-output branch'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and validate market data
        run: node scripts/data/update-market.mjs
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          DEBUG_DIR: ${{ (inputs.debug == true || inputs.debug == 'true') && 'live/debug' || '' }}
      - name: Commit if anything changed
        run: |
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/market.json
          [ -d live/debug ] && git add live/debug
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git add live/market-log.json
          git commit -m "Market data $(TZ=Asia/Kolkata date +%F' '%H:%M) IST [skip netlify]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Refresh CDN copy
        run: |
          for f in market.json market-log.json; do curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/live/$f" > /dev/null || true; done
