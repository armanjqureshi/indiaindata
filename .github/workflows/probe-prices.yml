name: Probe price sources
# One-off test of kitchen-staple price sources. Only writes live/debug/ ([skip netlify]).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-prices
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe/price-sources.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/debug/
          git diff --cached --quiet || (git commit -m "Price probe result [skip netlify]" && git pull --rebase -q && git push -q)
