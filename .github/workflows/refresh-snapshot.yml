name: Refresh site snapshot
# Triggers ONE Netlify rebuild so prerendered pages (what search engines see
# first) include the latest live/ data and any new IPO pages. Each run costs
# 15 Netlify credits on the free plan, so it is manual by default. To run it
# weekly, remove the "#" in front of the two schedule lines below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 2 * * 0'   # Sunday 08:00 IST
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > content/.snapshot
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/.snapshot
          git commit -m "Refresh prerendered snapshot"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
