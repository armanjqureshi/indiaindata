name: Fetch CPCB AQI bulletins (India runner)
# cpcb.nic.in stopped answering GitHub's servers on 13 Nov 2026. This job runs on the
# self-hosted runner in India, downloads the bulletins, stores them as a run artifact and
# starts "Update city AQI", which parses them on GitHub's servers. If the PC is off, the
# run waits in the queue and goes when it is back.
on:
  schedule:
    - cron: '15 12 * * *'   # 17:45 IST
    - cron: '45 14 * * *'   # 20:15 IST
    - cron: '30 3 * * *'    # 09:00 IST
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cpcb-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/data/fetch-cpcb.mjs fetch
      - uses: actions/upload-artifact@v4
        with:
          name: cpcb-bulletins
          path: cpcb-pdfs/
          retention-days: 7
          if-no-files-found: ignore
      - run: node scripts/data/fetch-cpcb.mjs dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
