name: Fetch CPCB AQI bulletins (India runner)
# Manual fallback only. CPCB downloads failed from 13 Nov 2026 because cpcb.nic.in's certificate
# expired, not because GitHub was blocked; update-aqi now handles that directly. This job runs on the
# self-hosted runner in India, downloads the bulletins, stores them as a run artifact and
# starts "Update city AQI", which parses them on GitHub's servers. If the PC is off, the
# run waits in the queue and goes when it is back.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cpcb-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/data/fetch-cpcb.mjs fetch
      - uses: actions/upload-artifact@v4
        with:
          name: cpcb-bulletins
          path: cpcb-pdfs/
          retention-days: 7
          if-no-files-found: ignore
      - run: node scripts/data/fetch-cpcb.mjs dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
