name: Update city AQI
# Reads CPCB's daily AQI bulletin (4 pm, 24-hour average, one figure per city) and writes
# live/aqi.json and live/aqi/<city>.json. Commits are marked [skip netlify]; the site loads
# live/ at runtime.
on:
  schedule:
    - cron: '0 12 * * *'    # 17:30 IST, bulletin is usually out by 5 pm
    - cron: '30 14 * * *'   # 20:00 IST, late bulletins
    - cron: '30 2 * * *'    # 08:00 IST, missed days and revisions
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Days before today to fetch (1 for the normal run)'
        default: '1'
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pdftotext
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Fetch and parse bulletins
        run: node scripts/data/update-aqi.mjs
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
      - name: Commit if anything changed
        run: |
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/aqi.json live/aqi 2>/dev/null || true
          grep -q '"errors": \[\]' live/aqi-log.json || git add live/aqi-log.json
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git add live/aqi-log.json
          git commit -q -m "AQI $(TZ=Asia/Kolkata date +%F' '%H:%M) IST [skip netlify]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Refresh CDN copy
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/live/aqi.json" > /dev/null || true
