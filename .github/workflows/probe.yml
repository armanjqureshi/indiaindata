name: probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe/probe.mjs > probe-output.txt 2>&1 || true
      - name: Publish output to probe-output branch
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          cp probe-output.txt /tmp/out.txt
          git checkout --orphan probe-output
          git rm -rf . > /dev/null
          cp /tmp/out.txt probe-output.txt
          git add probe-output.txt
          git commit -m "probe output"
          git push -f origin probe-output
