name: Probe credit card terms
# One-off: downloads issuers' credit card MITC / charges documents into data/raw/cc ([skip netlify]).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-cc
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pdftotext
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: node scripts/probe/cc-mitc.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/debug/ data/raw/
          git diff --cached --quiet || (git commit -m "Credit card terms probe [skip netlify]" && git pull --rebase -q && git push -q)
