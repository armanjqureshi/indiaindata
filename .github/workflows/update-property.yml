name: Update property prices
# City home prices from NHB RESIDEX (quarterly). Runs weekly so a new quarter shows up within days.
on:
  schedule:
    - cron: '20 4 * * 1'   # Mondays 09:50 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/data/update-property.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "india-in-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/property-cities.json 2>/dev/null || true
          grep -q '"errors": \[\]' live/property-log.json || git add live/property-log.json
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git add live/property-log.json
          git commit -q -m "Property prices $(TZ=Asia/Kolkata date +%F) [skip netlify]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Refresh CDN copy
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/live/property-cities.json" > /dev/null || true
